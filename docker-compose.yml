version: "3.7"

services:
  web:
    build: .
    ports:
      - "580:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CACHE_DIR=/app/cache
      - OMDB_API_KEY=${OMDB_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - rating-cache:/app/cache
    restart: unless-stopped

volumes:
  rating-cache:
